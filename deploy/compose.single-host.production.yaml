version: "2.4"

x-app: &app
  image: ${FDE_SERVER_IMAGE:?Set FDE_SERVER_IMAGE to the tested immutable image tag}
  env_file: [.env.production]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=0700
    - /home/fde/.sudo-fde:uid=10001,gid=10001,mode=0700
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [app]
  depends_on:
    postgres: {condition: service_healthy}
    minio: {condition: service_started}

services:
  postgres:
    image: ${FDE_POSTGRES_IMAGE:-sudo-fde-postgres:16-alpine-amd64}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fde}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FDE_DB_ADMIN_PASSWORD:?Set FDE_DB_ADMIN_PASSWORD}
      FDE_DB_PASSWORD: ${FDE_DB_PASSWORD:?Set FDE_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-postgres.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d fde"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app]

  minio:
    image: ${FDE_MINIO_IMAGE:-sudo-fde-minio:amd64}
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    volumes:
      - objects:/data
    restart: unless-stopped
    networks: [app]

  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

  storage-init:
    <<: *app
    restart: "no"
    command: [python, /opt/init-storage.py]
    volumes:
      - ./deploy/init-storage.py:/opt/init-storage.py:ro
    depends_on:
      minio: {condition: service_started}

  web:
    <<: *app
    image: ${FDE_WEB_IMAGE:?Set FDE_WEB_IMAGE to the tested immutable image tag}
    command: [fde, serve, --host, 0.0.0.0, --port, "8800"]
    ports: ["80:8800"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
      server: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    <<: *app
    command: [fde, server, --host, 0.0.0.0, --port, "8801"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app:
    driver: bridge

volumes:
  database:
  objects:
