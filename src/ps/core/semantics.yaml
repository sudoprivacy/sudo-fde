# 业务概念不一定有独立的表，也常以字段形式落在别的表里（例如库存记在商品表的"当前库存"列上）。
# 指纹要求某实体表而找不到时，按这里的字段标签再找一遍；找到即视为"以字段形式存在"。
realized_by_columns:
  stock_level: [stock_on_hand]
  shipment: [ship_date]
  payment: [paid_date]
  invoice: [invoice_date]
  ar_ledger: [due_date, paid_date]
  goods_receipt: [expected_arrival_date]
  milestone: [planned_date, actual_date]
  trial: [start_date]

# 拼音或缩写里常见的修饰 token，归一时忽略
noise_tokens: [tb, t, tbl, v, vw, sys, dim, fact, ods, dwd, info, xx, jbxx, data, master, main, base, the, of]
