[project]
name = "sudo-fde-server"
version = "1.0.0"
description = "Tenant-isolated FDE SaaS with governed knowledge and SudoRouter accounting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.27,<1", "argon2-cffi>=23", "PyJWT>=2.10,<3", "python-multipart>=0.0.20",
  "jinja2>=3.1", "pyyaml==6.0.3", "sqlglot==30.21.0", "jsonschema>=4",
  "pypdf>=6,<7", "python-docx>=1.1", "rdflib>=7,<8", "boto3>=1.35,<2",
  "prometheus-client>=0.21,<1", "email-validator>=2.2,<3", "cryptography>=43,<46"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.9", "playwright>=1.50"]
[project.scripts]
fde = "fde_server.cli:main"
fde-scan = "fdescan.cli:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
fde_server = ["templates/*.html", "static/*"]
ps = ["prompts/**/*.md", "core/*.yaml", "config/*.yaml"]
fdescan = ["*.yaml", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: real PostgreSQL isolation and migration acceptance", "router_live: opt-in live Router contract acceptance"]
[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["src/ps", "src/fdescan", "src/fde_server/bpmn.py", "tests/upstream_scanner"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
